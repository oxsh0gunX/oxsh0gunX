<svg xmlns="http://www.w3.org/2000/svg" width="800" height="180" viewBox="0 0 800 180">
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff2d95">
        <animate attributeName="stop-color" values="#ff2d95;#00e5ff;#ff2d95" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#00e5ff">
        <animate attributeName="stop-color" values="#00e5ff;#ff2d95;#00e5ff" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>
  <rect width="800" height="180" rx="16" fill="#0d1117"/>
  <text x="400" y="38" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="url(#neon)">DANCE MODE: ON</text>
  <g fill="#00ff88">
    <rect x="40" y="120" width="14" height="30">
      <animate attributeName="height" values="30;70;20;60;30" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="y" values="120;80;130;90;120" dur="1.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="64" y="100" width="14" height="50">
      <animate attributeName="height" values="50;20;65;30;50" dur="1.3s" repeatCount="indefinite"/>
      <animate attributeName="y" values="100;130;85;120;100" dur="1.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="88" y="115" width="14" height="35">
      <animate attributeName="height" values="35;75;25;55;35" dur="1.9s" repeatCount="indefinite"/>
      <animate attributeName="y" values="115;75;125;95;115" dur="1.9s" repeatCount="indefinite"/>
    </rect>
    <rect x="698" y="120" width="14" height="30">
      <animate attributeName="height" values="30;60;20;70;30" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="y" values="120;90;130;80;120" dur="1.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="722" y="100" width="14" height="50">
      <animate attributeName="height" values="50;25;60;35;50" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="y" values="100;125;90;115;100" dur="1.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="746" y="115" width="14" height="35">
      <animate attributeName="height" values="35;70;30;55;35" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="y" values="115;80;120;95;115" dur="1.4s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g stroke="#ff2d95" stroke-width="6" stroke-linecap="round" fill="none">
    <circle cx="400" cy="62" r="14" fill="#ff2d95" stroke="none"/>
    <line x1="400" y1="76" x2="400" y2="118"/>
    <line x1="400" y1="88" x2="370" y2="106">
      <animateTransform attributeName="transform" type="rotate" values="-15 400 88;20 400 88;-15 400 88" dur="1.2s" repeatCount="indefinite"/>
    </line>
    <line x1="400" y1="88" x2="430" y2="106">
      <animateTransform attributeName="transform" type="rotate" values="20 400 88;-15 400 88;20 400 88" dur="1.2s" repeatCount="indefinite"/>
    </line>
    <line x1="400" y1="118" x2="380" y2="152">
      <animateTransform attributeName="transform" type="rotate" values="10 400 118;-12 400 118;10 400 118" dur="1.2s" repeatCount="indefinite"/>
    </line>
    <line x1="400" y1="118" x2="422" y2="150">
      <animateTransform attributeName="transform" type="rotate" values="-10 400 118;12 400 118;-10 400 118" dur="1.2s" repeatCount="indefinite"/>
    </line>
  </g>
  <text x="300" y="150" font-size="30" fill="#00e5ff">♪
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -30;0 0" dur="2s" repeatCount="indefinite"/>
  </text>
  <text x="478" y="150" font-size="26" fill="#ff2d95">♫
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -24;0 0" dur="1.7s" repeatCount="indefinite"/>
  </text>
</svg>
